name: Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check update and reinstall keep past shifts
        shell: pwsh
        run: |
          $installer = (Get-ChildItem release/*Setup*.exe | Select-Object -First 1).FullName
          ./scripts/check-installer.ps1 -Installer $installer
      - uses: actions/upload-artifact@v4
        with:
          name: Dlya-Adminov-Windows
          path: release/*Setup*.exe
          if-no-files-found: error
      - name: Publish installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title "Dlya Adminov $version" --notes "Установщик Windows 10/11 (64 бит). Скачайте Dlya-Adminov-Setup-$version.exe, запустите и следуйте подсказкам. Инструкция — в README репозитория."
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $files = Get-ChildItem release/*Setup*.exe
          foreach ($file in $files) {
            gh release upload $tag $file.FullName --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
